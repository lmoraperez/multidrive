# El demonio de Gradle con memoria suficiente para el compilador de Kotlin. Sin esto, la
# primera compilacion de un proyecto limpio se queda sin memoria en maquinas normales.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX y no la biblioteca de soporte vieja, que lleva anos sin mantenerse.
android.useAndroidX=true

# Que Gradle no vaya a la red a por lo que ya tiene. No es solo velocidad: hace que una
# compilacion sin red falle diciendo que le falta algo, en vez de colgarse esperando.
org.gradle.caching=true
