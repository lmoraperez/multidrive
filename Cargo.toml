[workspace]
resolver = "3"
members = [
    "crates/multidrive-crypto",
    "crates/multidrive-raid",
    "crates/multidrive-backend",
    "crates/multidrive-core",
    "crates/multidrive-cli",
    "crates/multidrive-mount",
    "crates/multidrive-gui",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/lmoraperez/multidrive"
rust-version = "1.91"

[workspace.dependencies]
multidrive-crypto  = { path = "crates/multidrive-crypto" }
multidrive-raid    = { path = "crates/multidrive-raid" }
multidrive-backend = { path = "crates/multidrive-backend" }
multidrive-core    = { path = "crates/multidrive-core" }
multidrive-mount   = { path = "crates/multidrive-mount" }

thiserror = "2"
anyhow    = "1"
blake3    = "1"
tokio     = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
