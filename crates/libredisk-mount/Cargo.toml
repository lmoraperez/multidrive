[package]
name = "libredisk-mount"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
libredisk-core.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
widestring = "1.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Registry"] }
winfsp = "0.13"

[target.'cfg(windows)'.build-dependencies]
winfsp = "0.13"

[target."cfg(unix)".dependencies]
fuser = { version = "0.18.0", default-features = false }
libc = "0.2.189"

[dev-dependencies]
libredisk-backend.workspace = true
libredisk-crypto.workspace = true
libredisk-raid.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
