[package]
name = "multidrive-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
blake3.workspace = true
futures = "0.3.34"
multidrive-backend.workspace = true
multidrive-crypto.workspace = true
multidrive-raid.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
async-trait = "0.1.92"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Solo para el ejemplo `android`, que comprueba si el verificador de certificados funciona en
# un movil. Va con las mismas caracteristicas que en el backend para no meter una segunda pila
# de TLS en el arbol, y por dev-dependency: no entra en nada de lo que se distribuye.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
