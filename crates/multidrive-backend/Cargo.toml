[package]
name = "multidrive-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
opendal = { version = "0.59.2", features = ["layers-retry", "services-fs", "services-gdrive", "services-memory", "services-onedrive", "services-s3", "services-webdav"] }
# Se le pregunta a cada nube por su cupo con una peticion propia: OpenDAL no lo expone
# porque el cupo de una cuenta no es un objeto. No entra nada nuevo en el arbol: reqwest y
# serde_json ya estaban debajo de OpenDAL, y se piden con las mismas caracteristicas para no
# acabar con dos pilas de TLS en el mismo binario.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
# El transporte de OpenDAL, declarado aparte porque la fachada no lo reexporta y hace falta
# nombrarlo para darle **nuestro** cliente en vez del que se fabrica solo. Ver `http`.
opendal-http-transport-reqwest = "0.59.2"

serde_json.workspace = true
sha2 = "0.10"
rand = "0.10.2"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "sync", "net", "io-util", "time"] }

# Para el espacio de un directorio local, que lo sabe el sistema operativo y no la red. Las
# dos cajas ya estaban en el arbol por debajo; aqui solo se declaran como directas.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# Solo en Android: ahi el verificador de la plataforma declara revocado lo que no lo esta --un
# certificado sin OCSP ni CRL no se puede comprobar, y eso sale como si hubiera fallado-- y el
# almacen de confianza pasa a ser esta lista. El porque, y lo que cuesta, en `http`.
[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false }
webpki-roots = "1"
