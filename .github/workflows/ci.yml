name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias de Tauri
        # La ventana usa el webview del sistema, asi que en Linux necesita sus cabeceras. No
        # se excluye el crate del workspace a proposito: `--workspace` tiene que seguir
        # queriendo decir todo, o el dia que algo se rompa solo ahi nadie se entera.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Formato
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # La capa de montaje solo existe en Windows, asi que el job de linux no la compila:
  # `multidrive-mount` queda reducido a un stub por los `cfg(windows)` de sus dependencias.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: WinFsp
        # winfsp-sys necesita bindgen, y bindgen necesita libclang.
        run: |
          choco install winfsp -y --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: Tests
        run: cargo test --workspace

  # Construye el MSI en cada cambio, aunque nadie lo vaya a instalar: un instalador que solo
  # se compila el dia de la publicacion es un instalador que se descubre roto ese dia.
  #
  # Sin firmar. Los secretos de firma no se exponen a un job que corre en cada rama; la
  # version firmada sale de una publicacion etiquetada, no de aqui.
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: WinFsp
        run: choco install winfsp -y --no-progress
      - name: WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.BootstrapperApplications.wixext/5.0.2
      - name: Empaquetar
        # Construye el MSI y el instalador completo. El segundo se baja el de WinFsp y
        # comprueba su huella y su firma: si en esa URL apareciera algo distinto, se descubre
        # aqui y no el dia de la publicacion.
        run: .\packaging\windows\construir-msi.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: multidrive-instaladores
          path: |
            target/msi/*.msi
            target/msi/*.exe
          if-no-files-found: error

  # Que el nucleo siga pudiendo cruzar a Android, para que la portabilidad no se pudra sin
  # avisar.
  #
  # No prueba que Android funcione --no hay version de Android-- sino que nadie ate el nucleo
  # al sistema operativo sin darse cuenta. Hoy no hay un solo `cfg(windows)` ni `cfg(unix)` en
  # todo el workspace, y eso es lo que esto protege.
  #
  # Se queda en estos cuatro crates a proposito. `multidrive` --la linea de ordenes-- arrastra
  # `fuser`, y FUSE no existe para Android; tampoco haria falta, porque Android no deja montar
  # a nadie sin root y la integracion seria un `DocumentsProvider` sobre `multidrive-core`.
  android:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # Los dos que cruzan sin compilador de C. Van aparte y primero porque si estos fallan,
      # el fallo es del nucleo; si falla solo el paso siguiente, el fallo es del entorno.
      - name: Cruzar crypto y raid, sin NDK
        run: cargo check --target aarch64-linux-android -p multidrive-crypto -p multidrive-raid
      # El resto necesita un compilador de C por `aws-lc-sys`, debajo de rustls. El runner
      # trae NDK, asi que no hay nada que descargar.
      #
      # Si algun dia deja de traerlo, esto **falla** en vez de saltarse el paso. Un paso que se
      # salta solo y sigue en verde ensena a no mirarlo, y el dia que importe nadie se entera.
      - name: Cruzar backend y core, con el NDK del runner
        run: |
          test -n "$ANDROID_NDK_LATEST_HOME" || {
            echo "El runner ya no trae NDK. Hay que instalarlo aqui o quitar este paso."
            exit 1
          }
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo check --target aarch64-linux-android -p multidrive-backend -p multidrive-core

  # Que el nucleo siga compilando para el navegador, que es de lo que vive la version web.
  #
  # Mismo motivo que el de Android, pero aqui la trampa es otra: wasm32 no tiene ni hilos ni
  # disco ni red propia, y tokio se niega a compilar con cualquiera de esas caracteristicas.
  # Basta un `std::thread` o un `tokio::fs` fuera de `nativo` para romperlo, y sin esto se
  # descubriria abriendo la web.
  #
  # Clippy y no solo `check`: un `use` que solo sirve con `nativo` da aviso unicamente aqui.
  web:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Nucleo para el navegador, sin nada nativo
        run: |
          cargo clippy --target wasm32-unknown-unknown --no-default-features \
            -p multidrive-crypto -p multidrive-raid -p multidrive-backend-api -p multidrive-core \
            -p multidrive-web -- -D warnings
      # Y que enlace, que es otra cosa: clippy no enlaza, y el dia que una dependencia nueva
      # pida al sistema algo que el navegador no tiene --un reloj, azar-- compila y falla aqui.
      - name: Enlazar la version web
        run: cargo build --release --target wasm32-unknown-unknown -p multidrive-web

  # Monta de verdad con FUSE y usa el volumen como lo usaria un programa cualquiera.
  #
  # Va en un job aparte y no dentro de `test` porque necesita /dev/fuse, y un test que falla
  # por el entorno y no por el codigo entrena a la gente a ignorar los fallos. Por eso los
  # tests van marcados como ignorados y aqui se piden a mano.
  #
  # Los runners de GitHub permiten montar FUSE sin privilegios, asi que esto prueba tambien el
  # camino que en un contenedor LXC sin privilegios no funciona: el del ayudante fusermount3.
  fuse:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: FUSE
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fuse3
          ls -l /dev/fuse
          fusermount3 --version
      - name: Montar y usar
        run: cargo test -p multidrive-mount --test montaje_fuse -- --ignored --nocapture --test-threads=1
