name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # La capa de montaje solo existe en Windows, asi que el job de linux no la compila:
  # `libredisk-mount` queda reducido a un stub por los `cfg(windows)` de sus dependencias.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: WinFsp
        # winfsp-sys necesita bindgen, y bindgen necesita libclang.
        run: |
          choco install winfsp -y --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: Tests
        run: cargo test --workspace

  # Construye el MSI en cada cambio, aunque nadie lo vaya a instalar: un instalador que solo
  # se compila el dia de la publicacion es un instalador que se descubre roto ese dia.
  #
  # Sin firmar. Los secretos de firma no se exponen a un job que corre en cada rama; la
  # version firmada sale de una publicacion etiquetada, no de aqui.
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: WinFsp
        run: choco install winfsp -y --no-progress
      - name: WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Empaquetar
        run: .\packaging\windows\construir-msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: libredisk-msi
          path: target/msi/*.msi
          if-no-files-found: error
