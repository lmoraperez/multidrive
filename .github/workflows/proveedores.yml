# Suite de conformidad contra cuentas reales.
#
# Solo manual: hace peticiones de verdad contra las cuentas cuyos secretos esten
# configurados en el repositorio, y cuenta para sus limites de peticiones. Nunca en push.
#
# Los secretos que falten se traducen en variables vacias, y un proveedor sin ninguna
# variable se omite solo. Configurado a medias, falla ruidosamente: eso es deliberado.
name: Proveedores reales

on:
  workflow_dispatch:

jobs:
  conformidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Suite de conformidad
        env:
          MULTIDRIVE_TEST_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.MULTIDRIVE_TEST_ONEDRIVE_REFRESH_TOKEN }}
          MULTIDRIVE_TEST_ONEDRIVE_CLIENT_ID: ${{ secrets.MULTIDRIVE_TEST_ONEDRIVE_CLIENT_ID }}
          MULTIDRIVE_TEST_ONEDRIVE_CLIENT_SECRET: ${{ secrets.MULTIDRIVE_TEST_ONEDRIVE_CLIENT_SECRET }}
          MULTIDRIVE_TEST_GDRIVE_REFRESH_TOKEN: ${{ secrets.MULTIDRIVE_TEST_GDRIVE_REFRESH_TOKEN }}
          MULTIDRIVE_TEST_GDRIVE_CLIENT_ID: ${{ secrets.MULTIDRIVE_TEST_GDRIVE_CLIENT_ID }}
          MULTIDRIVE_TEST_GDRIVE_CLIENT_SECRET: ${{ secrets.MULTIDRIVE_TEST_GDRIVE_CLIENT_SECRET }}
          MULTIDRIVE_TEST_S3_BUCKET: ${{ secrets.MULTIDRIVE_TEST_S3_BUCKET }}
          MULTIDRIVE_TEST_S3_ENDPOINT: ${{ secrets.MULTIDRIVE_TEST_S3_ENDPOINT }}
          MULTIDRIVE_TEST_S3_REGION: ${{ secrets.MULTIDRIVE_TEST_S3_REGION }}
          MULTIDRIVE_TEST_S3_ACCESS_KEY_ID: ${{ secrets.MULTIDRIVE_TEST_S3_ACCESS_KEY_ID }}
          MULTIDRIVE_TEST_S3_SECRET_ACCESS_KEY: ${{ secrets.MULTIDRIVE_TEST_S3_SECRET_ACCESS_KEY }}
        run: cargo test -p multidrive-backend --test proveedores_reales -- --nocapture
